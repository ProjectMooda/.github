name: Sync Labels

on:
  push:
    paths:
      - ".github/labels.yml"

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync labels
        uses: micnncim/action-label-syncer@v1
        with:
          repository: |
            ProjectMooda/mooda-desktop
            ProjectMooda/mooda-app
            ProjectMooda/mooda-backend
          token: ${{ secrets.LABEL_SYNC_TOKEN }}
          manifest: labels.yml
